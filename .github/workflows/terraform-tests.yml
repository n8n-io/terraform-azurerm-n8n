name: Terraform Tests

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  # Terraform >= 1.11 required for `override_during` on `override_resource`
  # blocks in tftest.hcl files (used by the TLS submodules and the
  # examples to pin computed-at-apply attributes to plan-known synthetic
  # values under mock_provider). Bumped from 1.9.8 to track the version
  # the AGENTS.md combined-test-suite wall-clock note was measured on.
  TF_VERSION: "1.16.4"
  TFLINT_VERSION: "v0.64.0"
  # checkov results are version-dependent, so this gate pins one version
  # rather than tracking latest. tests/scripts/check-checkov.sh reads this
  # value and refuses to run against a different local version, which
  # makes this line the single source of truth for both. Bumping it is a
  # deliberate change: expect a new release to report findings that need
  # triaging in the same commit.
  CHECKOV_VERSION: "3.3.20"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # markdownlint results are version-dependent like checkov's; pinning here
  # keeps CI and the local dev-loop command in AGENTS.md on the same rules.
  MARKDOWNLINT_VERSION: "0.49.1"

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check -recursive
        run: terraform fmt -check -recursive -diff

  docs:
    name: terraform-docs (README in sync)
    runs-on: ubuntu-latest
    env:
      # Tracks the version `brew install terraform-docs` installs on macOS, so
      # contributors don't need a special install path. Different terraform-docs
      # versions emit different markdown table whitespace, so any drift between
      # CI and the version contributors actually use produces spurious diffs.
      # Bump together with the brew default.
      TERRAFORM_DOCS_VERSION: v0.24.0
    strategy:
      fail-fast: false
      matrix:
        # Only directories whose README.md carries a <!-- BEGIN_TF_DOCS -->
        # block. The two TLS submodules and modules/controllers are
        # intentionally excluded (their READMEs are hand-written without an
        # auto-generated reference table).
        target:
          [
            ".",
            "examples/small",
            "examples/medium",
            "examples/large",
            "examples/split-ingress",
            "examples/worker-pools",
            "examples/customer-managed-cluster",
            "examples/customer-managed-redis",
            "examples/customer-managed-storage",
            "examples/customer-managed-everything",
          ]
    steps:
      - uses: actions/checkout@v4

      - name: install terraform-docs
        run: |
          set -euo pipefail
          curl -sSLo /tmp/td.tar.gz \
            "https://terraform-docs.io/dl/${TERRAFORM_DOCS_VERSION}/terraform-docs-${TERRAFORM_DOCS_VERSION}-$(uname)-amd64.tar.gz"
          tar -xzf /tmp/td.tar.gz -C /tmp terraform-docs
          sudo install -m 0755 /tmp/terraform-docs /usr/local/bin/terraform-docs
          terraform-docs --version

      # All formatting options live in .terraform-docs.yml so this command
      # stays identical to what contributors run locally.
      - name: terraform-docs --output-check
        run: terraform-docs --output-check ${{ matrix.target }}

  validate:
    name: terraform validate (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            ".",
            "modules/controllers",
            "modules/tls-letsencrypt",
            "modules/tls-self-signed",
            "examples/small",
            "examples/medium",
            "examples/large",
            "examples/split-ingress",
            "examples/worker-pools",
            "examples/customer-managed-cluster",
            "examples/customer-managed-redis",
            "examples/customer-managed-storage",
            "examples/customer-managed-everything",
          ]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Cache the per-target .terraform/ provider plugins and the user-level
      # plugin cache. Keyed on the matrix target plus the lockfile / versions
      # pin so a provider bump invalidates cleanly. Falls back to the same
      # target's previous cache when the keys miss.
      - name: cache terraform plugins
        uses: actions/cache@v4
        with:
          path: |
            ~/.terraform.d/plugin-cache
            ${{ matrix.target }}/.terraform
          key: tf-${{ runner.os }}-${{ env.TF_VERSION }}-${{ matrix.target }}-${{ hashFiles(format('{0}/versions.tf', matrix.target), format('{0}/.terraform.lock.hcl', matrix.target)) }}
          restore-keys: |
            tf-${{ runner.os }}-${{ env.TF_VERSION }}-${{ matrix.target }}-

      - name: terraform init (no backend, providers only)
        working-directory: ${{ matrix.target }}
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: ${{ matrix.target }}
        run: terraform validate -no-color

  test:
    name: terraform test (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            ".",
            "modules/controllers",
            "modules/tls-letsencrypt",
            "modules/tls-self-signed",
            "examples/small",
            "examples/medium",
            "examples/large",
            "examples/split-ingress",
            "examples/worker-pools",
            "examples/customer-managed-cluster",
            "examples/customer-managed-redis",
            "examples/customer-managed-storage",
            "examples/customer-managed-everything",
          ]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: cache terraform plugins
        uses: actions/cache@v4
        with:
          path: |
            ~/.terraform.d/plugin-cache
            ${{ matrix.target }}/.terraform
          key: tf-${{ runner.os }}-${{ env.TF_VERSION }}-${{ matrix.target }}-${{ hashFiles(format('{0}/versions.tf', matrix.target), format('{0}/.terraform.lock.hcl', matrix.target)) }}
          restore-keys: |
            tf-${{ runner.os }}-${{ env.TF_VERSION }}-${{ matrix.target }}-

      - name: terraform init
        working-directory: ${{ matrix.target }}
        run: terraform init -backend=false

      - name: terraform test
        working-directory: ${{ matrix.target }}
        run: terraform test -verbose

  chart-check:
    name: n8n chart rendering check
    runs-on: ubuntu-latest
    needs: validate
    # The script normally finishes in a few minutes; without a job timeout a
    # hang runs into GitHub's 6 hour default and hides the failure.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # check-n8n-chart.sh feeds `terraform console` through stdin. The
          # action's Node wrapper does not forward piped stdin, so console
          # blocks forever; call the real binary instead.
          terraform_wrapper: false

      # jq ships preinstalled on the ubuntu-latest runner image; only helm
      # needs an explicit setup step.
      - uses: azure/setup-helm@v4.3.0
        with:
          version: "v3.16.4"

      - name: cache terraform plugins
        uses: actions/cache@v4
        with:
          path: |
            ~/.terraform.d/plugin-cache
            .terraform
          key: tf-${{ runner.os }}-${{ env.TF_VERSION }}-.-${{ hashFiles('versions.tf', '.terraform.lock.hcl') }}
          restore-keys: |
            tf-${{ runner.os }}-${{ env.TF_VERSION }}-.-

      - name: terraform init (no backend, providers only)
        run: terraform init -backend=false

      # Renders the pinned n8n Helm chart against this root module's actual
      # Helm values (from mocked Terraform plans) and asserts on the
      # manifests Helm produces. Offline: no cluster, no Azure credentials,
      # no apply. See tests/scripts/README.md#chart-rendering-check.
      - name: tests/scripts/check-n8n-chart.sh
        run: tests/scripts/check-n8n-chart.sh

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Redis exporter outage regression
        run: |
          export GOBIN="$(mktemp -d)"
          trap 'rm -rf "$GOBIN"' EXIT
          go install github.com/oliver006/redis_exporter@v1.90.0
          python3 tests/scripts/check-redis-exporter.py "$GOBIN/redis_exporter"

  smoke-test-self-check:
    name: smoke-test.sh offline self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n smoke-test.sh
        run: bash -n tests/scripts/smoke-test.sh

      # Exercises detect_topology() and check_deployment() against synthetic
      # kubectl fixtures (single-main, healthy multi-main, degraded
      # multi-main). Exits before the script's Preflight/az-login section, so
      # it needs no live cluster or Azure credentials. This is not the live
      # `smoke-test.sh` run against a real deployment — that stays manual,
      # per tests/scripts/README.md#smoke-test.
      - name: SMOKE_TEST_SELF_TEST=1 smoke-test.sh
        run: SMOKE_TEST_SELF_TEST=1 tests/scripts/smoke-test.sh

      # preflight-region-check.sh needs live Azure credentials for every real
      # check, so CI proves it parses, passes shellcheck, and that its input
      # validation and quota evaluation behave against synthetic fixtures
      # (PREFLIGHT_SELF_TEST=1 exits before any az/terraform call). See
      # tests/scripts/README.md#region-preflight.
      - name: bash -n + shellcheck + self-test preflight-region-check.sh
        run: |
          bash -n tests/scripts/preflight-region-check.sh
          shellcheck -S warning tests/scripts/preflight-region-check.sh
          tests/scripts/preflight-region-check.sh --help >/dev/null
          PREFLIGHT_SELF_TEST=1 tests/scripts/preflight-region-check.sh

      # Same for the scripts port-aws-050-enhancements added: real work
      # needs network or a live cluster, so CI proves syntax, shellcheck,
      # and the --help path only.
      - name: bash -n + shellcheck new scripts
        run: |
          for script in tests/scripts/chart-values-diff.sh tests/scripts/verify-worker-pools.sh \
            tests/scripts/check-version-drift.sh tests/scripts/check-checkov.sh scripts/check-example-parity.sh \
            scripts/check-variable-banners.sh; do
            bash -n "$script"
            shellcheck -S warning "$script"
          done
          tests/scripts/chart-values-diff.sh --help >/dev/null

  tflint:
    name: tflint (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            ".",
            "modules/controllers",
            "modules/tls-letsencrypt",
            "modules/tls-self-signed",
            "examples/small",
            "examples/medium",
            "examples/large",
            "examples/split-ingress",
            "examples/worker-pools",
            "examples/customer-managed-cluster",
            "examples/customer-managed-redis",
            "examples/customer-managed-storage",
            "examples/customer-managed-everything",
          ]
    # All targets share the single .tflint.hcl at the module root. tflint
    # reads TFLINT_CONFIG_FILE before falling back to ./.tflint.hcl, so each
    # example cell can reuse the root config without a duplicate.
    env:
      TFLINT_CONFIG_FILE: ${{ github.workspace }}/.tflint.hcl
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: cache terraform plugins
        uses: actions/cache@v4
        with:
          path: |
            ~/.terraform.d/plugin-cache
            ${{ matrix.target }}/.terraform
          key: tf-${{ runner.os }}-${{ env.TF_VERSION }}-${{ matrix.target }}-${{ hashFiles(format('{0}/versions.tf', matrix.target), format('{0}/.terraform.lock.hcl', matrix.target)) }}
          restore-keys: |
            tf-${{ runner.os }}-${{ env.TF_VERSION }}-${{ matrix.target }}-

      - name: terraform init (fetch modules for tflint)
        working-directory: ${{ matrix.target }}
        run: terraform init -backend=false

      - name: tflint --init
        working-directory: ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tflint --init

      - name: tflint
        working-directory: ${{ matrix.target }}
        run: tflint --format compact

  checkov:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.11 is the interpreter the pinned checkov was verified against,
      # and the one bridgecrewio's own checkov image ships.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Installed at a pinned version instead of via
      # bridgecrewio/checkov-action, which bakes the checkov version into
      # its own image: the @v12 tag moves to newer checkov releases on its
      # own schedule, so a clean local run says nothing about whether this
      # job would pass (terraform-aws-n8n observed exactly this: a version
      # drift silently changed which resources a whole check family even
      # reached). Pinning here makes CHECKOV_VERSION above the single
      # source of truth for both CI and local runs.
      - name: install checkov
        run: pip install "checkov==${{ env.CHECKOV_VERSION }}"

      # The same script contributors run, so "clean locally" and "clean in
      # CI" cannot drift apart. Module surfaces low-severity, uncurated
      # findings across every sizing example (e.g. subnet NSG associations,
      # storage SAS expiration policy) that are intentional defaults for a
      # getting-started template; continue-on-error preserves the previous
      # soft_fail: true posture until those are curated in a dedicated pass
      # (see AGENTS.md's "Static analysis" quality-bar section). The
      # opt-in second pass (tests/checkov/opt-in.tfvars,
      # port-aws-050-enhancements section 3) still runs and its coverage
      # assertion is not soft: check-checkov.sh exits non-zero, and this
      # step is still reported (yellow) in the GitHub UI, if it fails to
      # reach a listed opt-in resource.
      - name: checkov
        run: tests/scripts/check-checkov.sh
        continue-on-error: true

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install markdownlint-cli
        run: npm install -g "markdownlint-cli@${{ env.MARKDOWNLINT_VERSION }}"

      - name: markdownlint
        run: >
          markdownlint --config .markdownlint.yml
          README.md AGENTS.md 'docs/**/*.md' 'examples/**/README.md' 'modules/**/README.md'

  example-parity:
    name: example variable parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scripts/check-example-parity.sh
        run: scripts/check-example-parity.sh

  version-drift:
    name: version drift report (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: azure/setup-helm@v4.3.0
        with:
          version: "v3.16.4"

      # Report-only, matching tests/scripts/check-version-drift.sh's own
      # never-fail contract. continue-on-error keeps a network hiccup or a
      # page-format change from failing the build over a report.
      - name: tests/scripts/check-version-drift.sh
        run: tests/scripts/check-version-drift.sh
        continue-on-error: true
