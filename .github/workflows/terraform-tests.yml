name: Terraform Tests

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  # Terraform >= 1.11 required for `override_during` on `override_resource`
  # blocks in tftest.hcl files (used by the TLS submodules and the
  # examples to pin computed-at-apply attributes to plan-known synthetic
  # values under mock_provider). Bumped from 1.9.8 to track the version
  # the AGENTS.md combined-test-suite wall-clock note was measured on.
  TF_VERSION: "1.15.1"
  TFLINT_VERSION: "v0.53.0"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check -recursive
        run: terraform fmt -check -recursive -diff

  docs:
    name: terraform-docs (README in sync)
    runs-on: ubuntu-latest
    env:
      # Tracks the version `brew install terraform-docs` installs on macOS, so
      # contributors don't need a special install path. Different terraform-docs
      # versions emit different markdown table whitespace, so any drift between
      # CI and the version contributors actually use produces spurious diffs.
      # Bump together with the brew default.
      TERRAFORM_DOCS_VERSION: v0.24.0
    strategy:
      fail-fast: false
      matrix:
        # Only directories whose README.md carries a <!-- BEGIN_TF_DOCS -->
        # block. The two TLS submodules are intentionally excluded (their
        # READMEs are hand-written without an auto-generated reference table).
        target: [".", "examples/small", "examples/medium", "examples/large", "examples/split-ingress"]
    steps:
      - uses: actions/checkout@v4

      - name: install terraform-docs
        run: |
          set -euo pipefail
          curl -sSLo /tmp/td.tar.gz \
            "https://terraform-docs.io/dl/${TERRAFORM_DOCS_VERSION}/terraform-docs-${TERRAFORM_DOCS_VERSION}-$(uname)-amd64.tar.gz"
          tar -xzf /tmp/td.tar.gz -C /tmp terraform-docs
          sudo install -m 0755 /tmp/terraform-docs /usr/local/bin/terraform-docs
          terraform-docs --version

      # All formatting options live in .terraform-docs.yml so this command
      # stays identical to what contributors run locally.
      - name: terraform-docs --output-check
        run: terraform-docs --output-check ${{ matrix.target }}

  validate:
    name: terraform validate (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [".", "modules/tls-letsencrypt", "modules/tls-self-signed", "examples/small", "examples/medium", "examples/large", "examples/split-ingress"]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Cache the per-target .terraform/ provider plugins and the user-level
      # plugin cache. Keyed on the matrix target plus the lockfile / versions
      # pin so a provider bump invalidates cleanly. Falls back to the same
      # target's previous cache when the keys miss.
      - name: cache terraform plugins
        uses: actions/cache@v4
        with:
          path: |
            ~/.terraform.d/plugin-cache
            ${{ matrix.target }}/.terraform
          key: tf-${{ runner.os }}-${{ env.TF_VERSION }}-${{ matrix.target }}-${{ hashFiles(format('{0}/versions.tf', matrix.target), format('{0}/.terraform.lock.hcl', matrix.target)) }}
          restore-keys: |
            tf-${{ runner.os }}-${{ env.TF_VERSION }}-${{ matrix.target }}-

      - name: terraform init (no backend, providers only)
        working-directory: ${{ matrix.target }}
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: ${{ matrix.target }}
        run: terraform validate -no-color

  test:
    name: terraform test (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        target: [".", "modules/tls-letsencrypt", "modules/tls-self-signed", "examples/small", "examples/medium", "examples/large", "examples/split-ingress"]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: cache terraform plugins
        uses: actions/cache@v4
        with:
          path: |
            ~/.terraform.d/plugin-cache
            ${{ matrix.target }}/.terraform
          key: tf-${{ runner.os }}-${{ env.TF_VERSION }}-${{ matrix.target }}-${{ hashFiles(format('{0}/versions.tf', matrix.target), format('{0}/.terraform.lock.hcl', matrix.target)) }}
          restore-keys: |
            tf-${{ runner.os }}-${{ env.TF_VERSION }}-${{ matrix.target }}-

      - name: terraform init
        working-directory: ${{ matrix.target }}
        run: terraform init -backend=false

      - name: terraform test
        working-directory: ${{ matrix.target }}
        run: terraform test -verbose

  tflint:
    name: tflint (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [".", "modules/tls-letsencrypt", "modules/tls-self-signed", "examples/small", "examples/medium", "examples/large", "examples/split-ingress"]
    # All targets share the single .tflint.hcl at the module root. tflint
    # reads TFLINT_CONFIG_FILE before falling back to ./.tflint.hcl, so each
    # example cell can reuse the root config without a duplicate.
    env:
      TFLINT_CONFIG_FILE: ${{ github.workspace }}/.tflint.hcl
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: cache terraform plugins
        uses: actions/cache@v4
        with:
          path: |
            ~/.terraform.d/plugin-cache
            ${{ matrix.target }}/.terraform
          key: tf-${{ runner.os }}-${{ env.TF_VERSION }}-${{ matrix.target }}-${{ hashFiles(format('{0}/versions.tf', matrix.target), format('{0}/.terraform.lock.hcl', matrix.target)) }}
          restore-keys: |
            tf-${{ runner.os }}-${{ env.TF_VERSION }}-${{ matrix.target }}-

      - name: terraform init (fetch modules for tflint)
        working-directory: ${{ matrix.target }}
        run: terraform init -backend=false

      - name: tflint --init
        working-directory: ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tflint --init

      - name: tflint
        working-directory: ${{ matrix.target }}
        run: tflint --format compact

  checkov:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true
          # Module surfaces low-severity findings (e.g. PostgreSQL geo-redundant
          # backup, Storage Account public access knobs) that are intentional
          # defaults for a getting-started template. Flip soft_fail to false
          # once we curate suppressions — see the "Static analysis" section
          # of AGENTS.md's quality bar.
          soft_fail: true
          output_format: cli
          output_file_path: console
