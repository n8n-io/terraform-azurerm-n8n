name: Version drift report

# Reports, never bumps. See docs/versioning.md for the bump policy and
# tests/scripts/check-version-drift.sh for exactly what this checks (and, in
# its header comment, what it deliberately cannot see without Azure
# credentials this repo's CI does not hold).
"on":
  schedule:
    # Every Monday 09:00 UTC. Weekly is frequent enough to catch drift before
    # it compounds across several upstream releases, and infrequent enough
    # that nobody needs to triage it more than once a week.
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

# One run at a time: an overlapping workflow_dispatch and scheduled run would
# both miss the other's not-yet-created tracking issue and open a duplicate.
concurrency:
  group: version-drift
  cancel-in-progress: false

jobs:
  drift:
    name: check for outdated pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The script's chart-currency lookup uses `helm show chart`. Pin the same
      # Helm binary terraform-tests.yml uses instead of depending on whatever
      # the runner image happens to ship.
      - uses: azure/setup-helm@v4.3.0
        with:
          version: "v3.16.4"

      # The script exits 2 when any lookup failed. Record the exit code
      # instead of failing here, so the sync step still runs and the ERROR
      # lines reach the tracking issue; the last step fails the job. (Piping
      # the script straight into `tee` under `shell: bash`'s errexit and
      # pipefail would end this step at the script's exit 2, with the report
      # cut short and the sync skipped.)
      # The script prints plain text, not Markdown, so fence it; otherwise the
      # issue body and step summary collapse each section into one paragraph.
      # The header line records when and where the report was produced, since
      # an issue edit sends no notification and the body is replaced weekly.
      - name: run tests/scripts/check-version-drift.sh
        id: drift
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          tests/scripts/check-version-drift.sh >drift.txt 2>&1 || status=$?
          echo "status=${status}" >>"$GITHUB_OUTPUT"
          {
            echo "Generated $(date -u +%Y-%m-%dT%H:%MZ) by [workflow run](${RUN_URL})."
            echo
            echo '```text'
            cat drift.txt
            echo '```'
          } >report.md
          cat report.md >>"$GITHUB_STEP_SUMMARY"
          cat drift.txt

      # Drift never fails the build: every pin it flags is release-sized work
      # per docs/versioning.md, not something CI should auto-bump or gate on.
      # Sync the report to a single tracking issue so a stale pin shows up
      # where every other piece of repo work does, instead of only in a
      # scheduled run's job summary. Runs even when a lookup failed, so the
      # ERROR lines are synced too, but only for a complete report: one whose
      # last line is the script's summary. Exit 1 (curl or jq missing) or a
      # crash leaves no summary, and syncing that would replace the last good
      # report with a fragment, so the step fails instead.
      - name: sync tracking issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! -f report.md ]]; then
            echo "::error::no report was produced; leaving the tracking issue unchanged"
            exit 1
          fi
          summary_re='^check-version-drift\.sh: [0-9]+ pin\(s\) behind upstream, [0-9]+ lookup\(s\) failed$'
          if ! tail -n 1 drift.txt | grep -Eq "$summary_re"; then
            echo "::error::the drift report is incomplete (no summary line); leaving the tracking issue unchanged"
            exit 1
          fi
          title="Version drift report (automated)"
          existing="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --body-file report.md
          else
            gh issue create --title "$title" --body-file report.md
          fi

      # A failed lookup fails the job, after the sync above, so it is not
      # mistaken for "nothing changed".
      - name: fail on lookup errors
        if: always()
        shell: bash
        env:
          STATUS: ${{ steps.drift.outputs.status }}
        run: |
          if [[ "$STATUS" != "0" ]]; then
            echo "::error::check-version-drift.sh exited ${STATUS:-without running}; see the ERROR lines in the report"
            exit 1
          fi
