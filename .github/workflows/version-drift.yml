name: Version drift report

# Reports, never bumps. See docs/versioning.md for the bump policy and
# tests/scripts/check-version-drift.sh for exactly what this checks (its
# header comment also lists what it does not check). Needs no cloud
# credentials: every lookup is a public, unauthenticated API, plus the
# workflow token for the GitHub releases rate limit.
"on":
  schedule:
    # Every Monday 09:00 UTC. Weekly is frequent enough to catch drift before
    # it compounds across several upstream releases, and infrequent enough
    # that nobody needs to triage it more than once a week.
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

# One run at a time: an overlapping workflow_dispatch and scheduled run would
# both miss the other's not-yet-created tracking issue and open a duplicate.
concurrency:
  group: version-drift
  cancel-in-progress: false

jobs:
  drift:
    name: check for outdated pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The script's KEDA chart lookup uses `helm show chart`. Pin the same
      # Helm binary terraform-tests.yml uses instead of depending on whatever
      # the runner image happens to ship.
      - uses: azure/setup-helm@v4.3.0
        with:
          version: "v3.16.4"

      # The script exits 2 when any lookup failed. Record the exit code
      # instead of failing here, so the sync step still runs and the ERROR
      # lines reach the tracking issue; the last step fails the job.
      # The script prints plain text, not Markdown, so fence it; otherwise the
      # issue body and step summary collapse each section into one paragraph.
      # The header line records when and where the report was produced.
      - name: run tests/scripts/check-version-drift.sh
        id: drift
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          tests/scripts/check-version-drift.sh >drift.txt 2>&1 || status=$?
          echo "status=${status}" >>"$GITHUB_OUTPUT"
          {
            echo "Generated $(date -u +%Y-%m-%dT%H:%MZ) by [workflow run](${RUN_URL})."
            echo
            echo '```text'
            cat drift.txt
            echo '```'
          } >report.md
          cat report.md >>"$GITHUB_STEP_SUMMARY"
          cat drift.txt

      # Sync the report to one tracking issue labelled version-drift, so a
      # stale pin shows up where every other piece of repo work does. A
      # complete report replaces the body; an edit notifies nobody, so a
      # comment is posted only when the set of DRIFT:/ERROR: lines changed.
      # A clean report closes the issue, and findings that change while it
      # is closed reopen it; a manual close with unchanged findings stays
      # closed (only the body is refreshed).
      # An incomplete report writes nothing to GitHub (not even the label)
      # and fails this step. tests/scripts/drift-issue-sync.sh makes that
      # decision (offline self-test in terraform-tests.yml);
      # tests/scripts/test-version-drift-workflow.sh runs this step against a
      # fake gh. This step only calls gh.
      - name: sync tracking issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          label="version-drift"
          title="Version drift report (automated)"

          if [[ ! -f report.md ]]; then
            echo "::error::no report was produced; leaving the tracking issue unchanged"
            exit 1
          fi

          # Read-only lookups first; nothing is written until the report has
          # been validated below. The label alone does not identify the
          # tracker (a person may label a follow-up bump issue
          # version-drift), and title search is fuzzy, so every lookup keeps
          # only an exact title match.
          # tracker: the exact-title match that was closed last (closedAt),
          # then the highest number; open issues have no closedAt.
          tracker() {
            jq -r --arg t "$title" 'map(select(.title == $t)) | sort_by([.closedAt // "", .number]) | last | .number // empty'
          }
          # labelled <json> <number>: that issue already carries the label.
          labelled() {
            jq -e --argjson n "$2" --arg l "$label" 'any(.[]; .number == $n and any(.labels[]; .name == $l))' <<<"$1" >/dev/null
          }
          fields=number,title,closedAt,labels
          # Open labelled tracker first. Then an open unlabelled one (opened
          # before the label existed), which gets the label. Then the most
          # recently closed one, labelled or not, so drift coming back
          # reopens it instead of opening a duplicate.
          state=open
          needs_label=""
          number="$(gh issue list --label "$label" --state open --limit 100 --json "$fields" | tracker)"
          if [[ -z "$number" ]]; then
            number="$(gh issue list --state open --search "\"$title\" in:title" --limit 100 --json "$fields" | tracker)"
            [[ -z "$number" ]] || needs_label=1
          fi
          if [[ -z "$number" ]]; then
            state=closed
            closed="$({
              gh issue list --label "$label" --state closed --limit 100 --json "$fields"
              gh issue list --state closed --search "\"$title\" in:title" --limit 100 --json "$fields"
            } | jq -s 'add')"
            number="$(tracker <<<"$closed")"
            if [[ -n "$number" ]] && ! labelled "$closed" "$number"; then
              needs_label=1
            fi
          fi
          if [[ -n "$number" ]]; then
            gh issue view "$number" --json body --jq '.body' >previous.md
          else
            state=none
            : >previous.md
          fi

          action="$(tests/scripts/drift-issue-sync.sh action report.md previous.md "$state")"
          echo "tracking issue: ${number:-none} (${state}); action: ${action}"

          case "$action" in
            abort)
              echo "::error::the report is incomplete (its last line is not a valid summary, or the counts disagree with its lines); leaving the tracking issue unchanged"
              exit 1
              ;;
            noop) exit 0 ;;
            create | update | comment | reopen | close | close-quiet) ;;
            *)
              echo "::error::unexpected action '${action}' from drift-issue-sync.sh"
              exit 1
              ;;
          esac

          gh label create "$label" --force --color D93F0B \
            --description "Automated weekly version drift report (tests/scripts/check-version-drift.sh)"
          if [[ -n "$needs_label" ]]; then
            gh issue edit "$number" --add-label "$label"
          fi

          case "$action" in
            create)
              gh issue create --title "$title" --label "$label" --body-file report.md
              ;;
            update)
              gh issue edit "$number" --body-file report.md
              ;;
            comment | reopen)
              gh issue edit "$number" --body-file report.md
              header="Findings changed in [workflow run](${RUN_URL})."
              if [[ "$action" == "reopen" ]]; then
                gh issue reopen "$number"
                header="Reopening: findings changed in [workflow run](${RUN_URL})."
              fi
              {
                echo "$header"
                echo
                tests/scripts/drift-issue-sync.sh changes previous.md report.md
              } >comment.md
              gh issue comment "$number" --body-file comment.md
              ;;
            close)
              gh issue edit "$number" --body-file report.md
              gh issue close "$number" --comment "No drift and no lookup errors in [workflow run](${RUN_URL}). Closing; the next report with findings reopens this issue."
              ;;
            close-quiet)
              # Already clean (for example reopened by hand): no finding
              # changed, so close without a comment.
              gh issue edit "$number" --body-file report.md
              gh issue close "$number"
              ;;
          esac

      # Drift alone never fails the job (every flagged pin is release-sized
      # work per docs/versioning.md, not something CI should gate on). A
      # failed lookup does, after the sync above, so it is not mistaken for
      # "nothing changed".
      - name: fail on lookup errors
        if: always()
        shell: bash
        env:
          STATUS: ${{ steps.drift.outputs.status }}
        run: |
          if [[ "$STATUS" != "0" ]]; then
            echo "::error::check-version-drift.sh exited ${STATUS:-without running}; see the ERROR lines in the report"
            exit 1
          fi
